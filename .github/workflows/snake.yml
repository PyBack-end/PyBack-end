# Save as: .github/workflows/snake.yml  (in the PyBack-end/PyBack-end profile repo)
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%237c3aed&color_dots=%23ede9fe,%23d8b4fe,%23c084fc,%23a855f7,%236d28d9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23e9d5ff&color_dots=%23161b22,%233b1a7a,%235b21b6,%237c3aed,%23c084fc

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
